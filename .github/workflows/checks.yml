name: Public edition checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check publication boundaries
        run: python3 scripts/check_publication.py
      - name: Build the offline demo
        run: swift build
      - name: Run regression tests
        run: bash scripts/test-core.sh
