name: Release DMG
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build release executable
        run: |
          swift build -c release --product Jarvis

      - name: Package Jarvis.app
        run: |
          mkdir -p build/Jarvis.app/Contents/MacOS
          mkdir -p build/Jarvis.app/Contents/Resources
          
          # Copy release binary
          cp .build/release/Jarvis build/Jarvis.app/Contents/MacOS/Jarvis
          chmod +x build/Jarvis.app/Contents/MacOS/Jarvis

          # Copy app icon
          cp Sources/JarvisDemo/Resources/AppIcon.icns build/Jarvis.app/Contents/Resources/AppIcon.icns
          
          # Determine release version
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.2"
          fi

          # Create Info.plist with icon and version
          cat << EOF > build/Jarvis.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Jarvis</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.aliradid.jarvis</string>
              <key>CFBundleName</key>
              <string>Jarvis</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          mkdir -p dmg_root
          cp -r build/Jarvis.app dmg_root/
          ln -s /Applications dmg_root/Applications
          cp Sources/JarvisDemo/Resources/AppIcon.icns dmg_root/.VolumeIcon.icns 2>/dev/null || true
          SetFile -c icnC dmg_root/.VolumeIcon.icns 2>/dev/null || true
          SetFile -a C dmg_root 2>/dev/null || true
          hdiutil create -volname "Jarvis" -srcfolder dmg_root -ov -format UDZO Jarvis.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: Jarvis.dmg
          generate_release_notes: true
